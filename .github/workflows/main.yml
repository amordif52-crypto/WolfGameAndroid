name: Build Wolf Game APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WolfGameAndroid_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -o WolfGameAndroid_Project.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project/WolfGameAndroid_Project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WolfGame-APK
          path: project/**/build/outputs/apk/debug/*.apk
